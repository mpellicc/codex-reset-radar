name: Release

# release-please keeps a Release PR open that collects every Conventional Commit merged into main
# since the last release, with the next version and the CHANGELOG.md entry. Merging that PR
# creates a draft release and its tag; the build job then attaches the app and publishes it.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Latest stable image and Xcode on GitHub. Xcode 27's SwiftPM records the deployment target
    # instead of the SDK in the binary, which puts the app in macOS 13 compatibility mode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Check the version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "$plist" != "$VERSION" ]; then
            echo "::error::Info.plist says $plist but the release is $VERSION"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build, sign and zip
        run: scripts/build-app.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # One unversioned zip per release keeps releases/latest/download/CodexResetRadar.zip stable.
          mv "dist/CodexResetRadar-$VERSION.zip" dist/CodexResetRadar.zip
          gh release upload "$TAG" dist/CodexResetRadar.zip --clobber
          gh release edit "$TAG" --draft=false --latest
