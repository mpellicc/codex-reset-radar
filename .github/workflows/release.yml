name: Release

# release-please keeps a Release PR open that collects every Conventional Commit merged into main
# since the last release, with the next version and the CHANGELOG.md entry. Merging that PR
# creates a draft release and its tag; the build job then attaches the app and publishes it.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Latest stable image and Xcode on GitHub. Xcode 27's SwiftPM records the deployment target
    # instead of the SDK in the binary, which puts the app in macOS 13 compatibility mode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Check the version
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          plist=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "$plist" != "$VERSION" ]; then
            echo "::error::Info.plist says $plist but the release is $VERSION"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Resources/Info.plist

      - name: Build, sign and zip
        run: scripts/build-app.sh

      - name: Sign the update and write the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # One unversioned zip per release keeps releases/latest/download/CodexResetRadar.zip stable.
          mv "dist/CodexResetRadar-$VERSION.zip" dist/CodexResetRadar.zip
          # The release body is the CHANGELOG.md entry release-please wrote; Sparkle shows it as the notes.
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          scripts/make-appcast.sh "$TAG" "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # Installed apps read releases/latest/download/appcast.xml, so the appcast must be attached
          # before the release becomes the latest.
          gh release upload "$TAG" dist/CodexResetRadar.zip dist/appcast.xml --clobber
          gh release edit "$TAG" --draft=false --latest

      # Last, so a failure here never holds back the release itself.
      - name: Bump the Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so the cask still offers the previous version"
            exit 1
          fi
          sha=$(shasum -a 256 dist/CodexResetRadar.zip | cut -d ' ' -f 1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/mpellicc/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          cask=Casks/codex-reset-radar.rb
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$cask"
          if git diff --quiet; then
            echo "The cask already offers $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update codex-reset-radar to $VERSION"
          git push
