name: PR title

# Pull requests are squash-merged with their title as the commit message, and release-please reads
# those commits to pick the next version and write the changelog, so titles must follow
# Conventional Commits (feat:, fix:, docs:, chore:, ...).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
